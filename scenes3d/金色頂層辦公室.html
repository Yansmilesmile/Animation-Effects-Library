<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金色頂層辦公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: a locked 16:9 stage centered on black, thin pixel-font control strip below it (hidden with H) */
:root{
  --bg:#050407; --ink:#f1e7d2; --muted:#a8977a; --panel:rgba(20,15,8,.78);
  --edge:#4a3a20; --accent:#e9c46a;
  --pixel:"DotGothic16","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--pixel);display:grid;place-items:center}
#stage{display:block;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;max-width:100%;image-rendering:pixelated}
.ui{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;pointer-events:none}
.group{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--edge);padding:4px;pointer-events:auto}
.group span{color:var(--muted);font-size:12px;padding:0 6px}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid transparent;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--edge)}
button[aria-pressed="true"]{background:var(--accent);color:#1d1406}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:110px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;padding:0 8px}
body.clean .ui{display:none}
</style>

<canvas id="stage" aria-label="像素風金色頂層辦公室，落地窗外是閃爍的城市夜景"></canvas>

<div class="ui">
  <div class="group" role="group" aria-label="像素大小">
    <span>像素</span>
    <button data-res="180">粗</button>
    <button data-res="270" aria-pressed="true">中</button>
    <button data-res="360">細</button>
    <button data-res="0">關</button>
  </div>
  <div class="group">
    <button id="neonBtn" aria-pressed="true">霓虹閃爍</button>
    <button id="bloomBtn" aria-pressed="true">光暈</button>
    <button id="reflBtn" aria-pressed="true">地面倒影</button>
    <span>亮度</span>
    <input id="expo" type="range" min="0.4" max="1.3" step="0.05" value="0.78" aria-label="亮度">
  </div>
  <div class="group"><span class="hint">H 隱藏介面，方便錄屏</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ---------- helpers ----------
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function tex(cv,rx=1,ry=1){
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.LinearMipmapLinearFilter; t.anisotropy=4;
  return t;
}
const V2=(x,y)=>new THREE.Vector2(x,y), V3=(x,y,z)=>new THREE.Vector3(x,y,z);

// ---------- procedural pixel textures ----------
function ornament(c,x0,y0,w,h,r,base='#b8862c'){ // gold relief: clustered random walks in four golds
  const pal=['#ffe28a','#d9a740','#a8741f','#5e3d10'];
  c.fillStyle=base; c.fillRect(x0,y0,w,h);
  for(let k=0;k<w*h/6;k++){
    let x=x0+r()*w|0,y=y0+r()*h|0; const col=pal[r()*4|0];
    for(let s=0;s<5;s++){c.fillStyle=col;c.fillRect(x,y,1,1);x+=(r()*3|0)-1;y+=(r()*3|0)-1;
      if(x<x0||y<y0||x>=x0+w||y>=y0+h)break;}
  }
}
function goldPanelTex(seed){ // carved door leaf: two raised panels with relief
  const r=rng(seed),[cv,c]=cvs(48,96);
  c.fillStyle='#e8bb5c'; c.fillRect(0,0,48,96);
  ornament(c,0,0,48,96,r,'#c99436');
  for(const [y,h] of [[6,38],[52,38]]){
    c.fillStyle='#4e3209'; c.fillRect(4,y-2,40,h+4);
    c.fillStyle='#ffe9a6'; c.fillRect(5,y-1,38,h+2);
    c.fillStyle='#f1cf78'; c.fillRect(6,y,36,h);
    ornament(c,8,y+2,32,h-4,r);
  }
  return cv;
}
function filigreeTex(seed,base){ // cream plaster with gilt scrolls (ceiling, frieze)
  const r=rng(seed),[cv,c]=cvs(64,64);
  c.fillStyle=base; c.fillRect(0,0,64,64);
  for(let i=0;i<200;i++){c.fillStyle='rgba(255,255,255,.25)';c.fillRect(r()*64|0,r()*64|0,2,1);}
  for(let k=0;k<14;k++){
    let x=r()*64,y=r()*64,a=r()*6.28,da=(r()<.5?-1:1)*(0.12+r()*0.18);
    for(let s=0;s<34;s++){
      c.fillStyle=s%7===0?'#8a5a18':'#c9922e'; c.fillRect((x+64)%64|0,(y+64)%64|0,1,1);
      if(s%9===4){c.fillStyle='#e9b955';c.fillRect((x+65)%64|0,(y+64)%64|0,1,1);} // leaf nubs
      x+=Math.cos(a); y+=Math.sin(a); a+=da; da*=1.04;
    }
  }
  return cv;
}
function marbleTex(seed,base,vein,veins=5){
  const r=rng(seed),[cv,c]=cvs(64,64);
  c.fillStyle=base; c.fillRect(0,0,64,64);
  for(let i=0;i<300;i++){c.fillStyle=r()<.5?'rgba(255,255,255,.18)':'rgba(120,90,50,.08)';c.fillRect(r()*64|0,r()*64|0,2,1);}
  for(let v=0;v<veins;v++){let x=r()*64,y=r()*64;c.fillStyle=vein;
    for(let s=0;s<70;s++){c.fillRect(x|0,y|0,1,1);x+=r()*1.6-.3;y+=r()*2-1;x=(x+64)%64;y=(y+64)%64;}}
  return cv;
}
function floorTex(){ // polished amber marble tiles with thin gilt joints
  const [cv,c]=cvs(64,64); c.drawImage(marbleTex(11,'#c4904c','#8e6430',6),0,0);
  c.fillStyle='#e7bd6a'; c.fillRect(0,0,64,1); c.fillRect(0,0,1,64);
  c.fillStyle='#7a5222'; c.fillRect(0,1,64,1); c.fillRect(1,0,1,64);
  return cv;
}
function rugTex(){ // one whole rug: diamond quilting, scalloped border
  const [cv,c]=cvs(96,128);
  c.fillStyle='#efe6d2'; c.fillRect(0,0,96,128);
  c.fillStyle='#ddd1b6';
  for(let i=-128;i<128;i+=12) for(let t=0;t<128;t++){c.fillRect(i+t,t,1,1);c.fillRect(i+128-t,t,1,1);}
  c.fillStyle='rgba(255,252,240,.6)'; for(let i=0;i<260;i++)c.fillRect(Math.random()*96|0,Math.random()*128|0,1,1);
  c.fillStyle='#d4c39d'; c.fillRect(0,0,96,3);c.fillRect(0,125,96,3);c.fillRect(0,0,3,128);c.fillRect(93,0,3,128);
  c.fillStyle='#e4d6b6'; for(let x=4;x<92;x+=6){c.fillRect(x,4,3,2);c.fillRect(x,122,3,2);} for(let y=6;y<122;y+=6){c.fillRect(4,y,2,3);c.fillRect(90,y,2,3);}
  return cv;
}
function frescoTex(seed){ // painted sky with drifting cherubs and a gilt filigree border
  const r=rng(seed),[cv,c]=cvs(128,96);
  const g=c.createLinearGradient(0,0,0,96); g.addColorStop(0,'#f6e7c4'); g.addColorStop(.5,'#e9dccb'); g.addColorStop(1,'#d8c3a0');
  c.fillStyle=g; c.fillRect(0,0,128,96);
  for(let i=0;i<16;i++){const x=r()*128,y=r()*96,s=6+r()*14;
    for(let k=0;k<26;k++){c.fillStyle=k%3?'rgba(255,250,236,.55)':'rgba(214,190,160,.35)';c.fillRect(x+(r()-.5)*s*2|0,y+(r()-.5)*s|0,4,2);}}
  for(let i=0;i<3;i++){const x=24+r()*80,y=26+r()*44;
    c.fillStyle='#c48d62'; c.fillRect(x,y,8,4); c.fillRect(x+2,y+4,5,3);
    c.fillStyle='#f0caa0'; c.fillRect(x+1,y-3,4,3);
    c.fillStyle='#f8f1e6'; c.fillRect(x-3,y-1,3,2); c.fillRect(x+8,y-1,3,2);
    c.fillStyle='#9a4a3a'; c.fillRect(x+4,y+1,5,2);} // draped cloth
  c.drawImage(filigreeTex(seed+1,'#f2e5c8'),0,0,128,14);
  c.drawImage(filigreeTex(seed+2,'#f2e5c8'),0,82,128,14);
  c.fillStyle='#b57f22'; c.fillRect(0,13,128,1); c.fillRect(0,82,128,1);
  c.fillStyle='#d9a641'; c.fillRect(0,0,128,2); c.fillRect(0,94,128,2); c.fillRect(0,0,2,96); c.fillRect(126,0,2,96);
  return cv;
}
function columnTex(){
  const [cv,c]=cvs(32,8);
  for(let x=0;x<32;x++){c.fillStyle=x%4===0?'#c3b393':x%4===1?'#f6eedb':'#e6dcc4';c.fillRect(x,0,1,8);}
  return cv;
}

// ---------- renderer & scene ----------
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.autoClear=false;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#0a0710');
const world=new THREE.Group(); scene.add(world); // everything except the floor; mirrored for the floor reflection
const camera=new THREE.PerspectiveCamera(50,16/9,0.1,200);
camera.position.set(0,2.4,9.6); camera.lookAt(0,2.85,-8);

world.add(new THREE.HemisphereLight(0xffe2b0,0x4a3218,0.6));
const warm=0xffc67a;

// materials
const goldMat=new THREE.MeshPhongMaterial({color:0xc8952e,emissive:0x2a1904,specular:0xffe2a0,shininess:60});
const goldBright=new THREE.MeshPhongMaterial({color:0xe9bb52,emissive:0x40280a,specular:0xfff0c0,shininess:90});
const goldDark=new THREE.MeshPhongMaterial({color:0x8a5e1c,emissive:0x1a0f02,specular:0xd8a860,shininess:40});
const panelMat=new THREE.MeshPhongMaterial({map:tex(goldPanelTex(5)),emissive:0x2a1804,specular:0xffd890,shininess:55});
const marbleMat=new THREE.MeshPhongMaterial({map:tex(marbleTex(7,'#ece2cd','#c8b597')),specular:0x3a2e1c,shininess:40});
const filigreeMat=new THREE.MeshPhongMaterial({map:tex(filigreeTex(3,'#f0e3c6'),4,4),emissive:0x2a1d0a,shininess:10});
const fabric=new THREE.MeshPhongMaterial({color:0xf2e8d2,shininess:8});
const fabricShade=new THREE.MeshPhongMaterial({color:0xe2d4b6,shininess:6});
const glassMat=new THREE.MeshPhongMaterial({color:0xdfeeff,transparent:true,opacity:0.28,specular:0xffffff,shininess:140,depthWrite:false});
const mirrorMat=new THREE.MeshPhongMaterial({color:0x6a4e2c,emissive:0x1a1006,specular:0xffe0b0,shininess:140});
const glowWhite=new THREE.MeshBasicMaterial({color:0xfff3dc});

function add(m,parent=world){parent.add(m);return m;}
function box(w,h,d,mat,x,y,z,parent=world){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);return add(m,parent);}
function cyl(rt,rb,h,mat,x,y,z,seg=10,parent=world){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);return add(m,parent);}
function lathe(profile,mat,x,y,z,seg=14,parent=world){const m=new THREE.Mesh(new THREE.LatheGeometry(profile.map(p=>V2(p[0],p[1])),seg),mat);m.position.set(x,y,z);return add(m,parent);}
function tube(points,r,mat,parent=world){return add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),10,r,5,false),mat),parent);}
function frame3d(w,h,t,mat,x,y,z,rotY=0,parent=world){ // raised gilt picture-frame molding
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=rotY; parent.add(g);
  box(w,t,t,mat,0,h/2,0,g); box(w,t,t,mat,0,-h/2,0,g); box(t,h,t,mat,-w/2,0,0,g); box(t,h,t,mat,w/2,0,0,g);
  return g;
}

// room: x -7..7, back wall z=-8, doorway plane z=6.6, ceiling 6.2
const ROOM_X=7, BACK=-8, DOOR_Z=6.6, CEIL=6.2, MID=(DOOR_Z+BACK)/2, LEN=DOOR_Z-BACK;

// floor (outside the world group: it receives the mirrored room)
const floorMat=new THREE.MeshPhongMaterial({map:tex(floorTex(),7,9),specular:0xb08a50,shininess:120,transparent:true,opacity:0.8});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM_X*2,LEN+6),floorMat);
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,MID+3); scene.add(floor);

{ // rug
  const rug=new THREE.Mesh(new THREE.BoxGeometry(9.2,0.04,11),new THREE.MeshPhongMaterial({map:tex(rugTex()),color:0xa89d88,shininess:2,specular:0x000000}));
  rug.position.set(0,0.02,-1.9); world.add(rug);
}

// ---------- back wall, panoramic window, colonnade ----------
const WIN_R=3.4, WIN_B=0.35, WIN_T=4.9;
{
  const bw=new THREE.MeshPhongMaterial({map:tex(marbleTex(41,'#ebdfc6','#c4ad88'),2,3),specular:0x2a2010,shininess:30});
  for(const s of [-1,1]) box(ROOM_X-WIN_R,CEIL,0.3,bw,s*(WIN_R+(ROOM_X-WIN_R)/2),CEIL/2,BACK);
  box(WIN_R*2,CEIL-WIN_T,0.3,bw,0,(CEIL+WIN_T)/2,BACK);
  box(WIN_R*2,WIN_B,0.3,goldDark,0,WIN_B/2,BACK);
  const frame=new THREE.MeshPhongMaterial({color:0x6a4a1e,emissive:0x140c02,specular:0xffd080,shininess:60});
  box(WIN_R*2+0.24,0.14,0.24,goldMat,0,WIN_T,BACK+0.05); box(WIN_R*2+0.24,0.14,0.24,goldMat,0,WIN_B,BACK+0.05);
  for(const x of [-3.4,0,3.4]) box(0.16,WIN_T-WIN_B,0.24,goldMat,x,(WIN_T+WIN_B)/2,BACK+0.05);
  for(const x of [-1.7,1.7]) box(0.06,WIN_T-WIN_B,0.16,frame,x,(WIN_T+WIN_B)/2,BACK+0.05);
  box(WIN_R*2,0.07,0.16,goldBright,0,1.15,BACK+0.15);   // brass guard rail behind the chairs
  for(const x of [-2.6,-0.9,0.9,2.6]) cyl(0.025,0.025,0.8,goldBright,x,0.75,BACK+0.15,6);
  const g=new THREE.Mesh(new THREE.PlaneGeometry(WIN_R*2,WIN_T-WIN_B),new THREE.MeshPhongMaterial({color:0x8899cc,transparent:true,opacity:0.07,specular:0xffffff,shininess:150,depthWrite:false}));
  g.position.set(0,(WIN_T+WIN_B)/2,BACK-0.02); world.add(g);
  // mirrors between the column pairs
  for(const s of [-1,1]){ box(1.6,3.6,0.04,mirrorMat,s*5.05,2.4,BACK+0.17); frame3d(1.7,3.7,0.09,goldBright,s*5.05,2.4,BACK+0.2); }
}
{ // columns: fluted shafts, gilded bases and capitals with volutes
  const cm=new THREE.MeshPhongMaterial({map:tex(columnTex(),3,1),specular:0x3a2e1c,shininess:40});
  for(const x of [-6.1,-3.95,3.95,6.1]){
    const z=BACK+0.55;
    cyl(0.29,0.31,4.0,cm,x,2.35,z,16);
    lathe([[0,0],[.46,0],[.46,.12],[.38,.16],[.38,.24],[.33,.3],[.31,.38]],goldMat,x,0,z,16);
    lathe([[.29,0],[.33,.06],[.42,.22],[.5,.38],[.52,.48],[0,.48]],goldBright,x,4.32,z,16);
    for(let k=0;k<8;k++){const a=k/8*Math.PI*2; const leaf=box(0.1,0.3,0.06,goldMat,x+Math.cos(a)*0.38,4.5,z+Math.sin(a)*0.38); leaf.rotation.y=-a; leaf.rotation.x=0.25;}
    for(const sx of [-1,1]){const v=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.035,5,10),goldBright); v.position.set(x+sx*0.42,4.72,z+0.32); world.add(v);}
    box(1.1,0.12,1.1,goldMat,x,4.86,z);
  }
  box(14,0.4,1.3,goldMat,0,5.12,BACK+0.55);       // entablature
  box(14,0.14,1.4,goldBright,0,5.38,BACK+0.55);
  const fr=new THREE.Mesh(new THREE.BoxGeometry(14,0.32,0.05),filigreeMat); fr.position.set(0,5.12,BACK+1.22); world.add(fr);
  box(14,CEIL-5.45,0.3,new THREE.MeshPhongMaterial({map:tex(filigreeTex(9,'#efe1c2'),12,1),emissive:0x2a1d0a,shininess:10}),0,(CEIL+5.45)/2,BACK+0.3);
}

// ---------- side walls: gilt-framed relief panels, mirrors, mezzanine ----------
for(const s of [-1,1]){
  const rot=-s*Math.PI/2, wx=s*ROOM_X;
  const w=new THREE.Mesh(new THREE.PlaneGeometry(LEN,CEIL),new THREE.MeshPhongMaterial({map:tex(marbleTex(20+s,'#e6d9bf','#c6b190'),4,2),specular:0x2a2010,shininess:25}));
  w.rotation.y=rot; w.position.set(wx,CEIL/2,MID); world.add(w);
  for(const z of [-5.6,-1.2,3.2]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(2.2,3.0,0.06),panelMat); p.rotation.y=rot; p.position.set(wx-s*0.04,2.0,z); world.add(p);
    frame3d(2.4,3.2,0.12,goldBright,wx-s*0.08,2.0,z,rot);
    box(0.1,4.2,0.28,goldMat,wx-s*0.05,2.1,z+2.2);    // pilaster between panels
  }
  box(0.6,0.25,LEN,goldDark,wx-s*0.3,0.12,MID);       // skirting
  // mezzanine gallery with glass balustrade
  box(1.3,0.22,LEN,marbleMat,wx-s*0.65,4.45,MID);
  box(1.34,0.1,LEN,goldBright,wx-s*0.65,4.3,MID);
  const rail=new THREE.Mesh(new THREE.PlaneGeometry(LEN,0.62),glassMat);
  rail.rotation.y=rot; rail.position.set(wx-s*1.3,4.87,MID); world.add(rail);
  box(0.07,0.06,LEN,goldBright,wx-s*1.3,5.2,MID);
  for(let z=BACK+0.6;z<DOOR_Z;z+=1.4) box(0.04,0.62,0.04,goldBright,wx-s*1.3,4.87,z);
  box(0.06,1.4,LEN,mirrorMat,wx-s*0.03,5.3,MID);       // dark mirrored upper wall
}

// ---------- ceiling: crown molding, two frescoed coffers, cove light ----------
{
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(ROOM_X*2,LEN),filigreeMat);
  ceil.rotation.x=Math.PI/2; ceil.position.set(0,CEIL,MID); world.add(ceil);
  const coveMat=new THREE.MeshBasicMaterial({color:0xffdca0});
  function coffer(x0,x1,z0,z1,up,seed){
    const f=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),new THREE.MeshPhongMaterial({map:tex(frescoTex(seed)),emissive:0x4a3618,shininess:5}));
    f.rotation.x=Math.PI/2; f.position.set((x0+x1)/2,CEIL+up-0.01,(z0+z1)/2); world.add(f);
    const cx=(x0+x1)/2, cz=(z0+z1)/2;
    // stepped recess sides, gilded
    box(x1-x0,up,0.08,filigreeMat,cx,CEIL+up/2,z0); box(x1-x0,up,0.08,filigreeMat,cx,CEIL+up/2,z1);
    box(0.08,up,z1-z0,filigreeMat,x0,CEIL+up/2,cz); box(0.08,up,z1-z0,filigreeMat,x1,CEIL+up/2,cz);
    box(x1-x0,0.06,0.06,coveMat,cx,CEIL+0.04,z0+0.1); box(x1-x0,0.06,0.06,coveMat,cx,CEIL+0.04,z1-0.1);
    box(0.06,0.06,z1-z0,coveMat,x0+0.1,CEIL+0.04,cz); box(0.06,0.06,z1-z0,coveMat,x1-0.1,CEIL+0.04,cz);
    for(const z of [z0,z1]) box(x1-x0+0.5,0.22,0.3,goldBright,cx,CEIL-0.08,z);
    for(const x of [x0,x1]) box(0.3,0.22,z1-z0+0.5,goldBright,x,CEIL-0.08,cz);
    for(const z of [z0-0.25,z1+0.25]) box(x1-x0+1,0.1,0.2,goldMat,cx,CEIL-0.2,z);
  }
  coffer(-3.2,3.2,-2.4,3.6,0.9,31);

  renderer.setPixelRatio(dpr); renderer.setSize(rect.width,rect.height,false);
  const h=resH||Math.round(rect.height*dpr);
  lowRT.setSize(Math.round(h*16/9),h);
  bloomRT.setSize(Math.round(rect.width/5),Math.round(rect.height/5));
  lightMat.uniforms.scale.value=Math.max(1,h/270);
}
addEventListener('resize',resize);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now();
function frame(now){
  lightMat.uniforms.time.value=reduce?0:(now-t0)/1000;
  renderRoom(lowRT,reflOn);
  if(bloomOn) renderRoom(bloomRT,false);
  quadMat.uniforms.bloom.value=bloomOn?1:0;
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(quadScene,quadCam);
  requestAnimationFrame(frame);
}

// ---------- UI ----------
const resBtns=[...document.querySelectorAll('[data-res]')];
resBtns.forEach(b=>b.addEventListener('click',()=>{resH=+b.dataset.res;resBtns.forEach(o=>o.setAttribute('aria-pressed',String(o===b)));resize();}));
const $=id=>document.getElementById(id);
$('neonBtn').onclick=e=>{const on=lightMat.uniforms.neon.value?0:1;lightMat.uniforms.neon.value=on;e.currentTarget.setAttribute('aria-pressed',String(!!on));};
$('bloomBtn').onclick=e=>{bloomOn=!bloomOn;e.currentTarget.setAttribute('aria-pressed',String(bloomOn));};
$('reflBtn').onclick=e=>{reflOn=!reflOn;e.currentTarget.setAttribute('aria-pressed',String(reflOn));};
$('expo').oninput=e=>{quadMat.uniforms.expo.value=+e.target.value;};
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean');});

resize();
requestAnimationFrame(frame);
</script>

</html>
